      pay=Math.max(pay,700000);
    }
    monthlyPays.push(pay);
    total+=pay;
  }

  document.getElementById('res-main').textContent=won(total);

  // ?붾퀎 洹몃━??(理쒕? 12媛?
  const showMonths=monthlyPays.slice(0,12);
  document.getElementById('month-grid').innerHTML=showMonths.map((p,i)=>`
    <div class="month-box">
      <div class="m-label">${i+1}媛쒖썡李?/div>
      <div class="m-val">${(p/10000).toFixed(0)}留뚯썝</div>
    </div>`).join('');

  document.getElementById('res-detail').innerHTML=`
    <div class="result-row"><span>???듭긽?꾧툑</span><strong>${won(wage)}</strong></div>
    <div class="result-row"><span>?≪븘?댁쭅 ?좏삎</span><strong>${type==='both'?'6+6 遺紐??≪븘?댁쭅':'?쇰컲 ?≪븘?댁쭅'}</strong></div>
    <div class="result-row"><span>?좎껌 湲곌컙</span><strong>${months}媛쒖썡</strong></div>
    <div class="result-row"><span>???됯퇏 ?섎졊??/span><strong>${won(Math.round(total/months))}</strong></div>
    <div class="result-row"><span>珥??섎졊??/span><strong style="color:#db2777">${won(total)}</strong></div>
    <div style="font-size:11px;color:#888;margin-top:8px">??2026??湲곗?. ?ы썑吏湲됯툑 ?먯?(2025.1.1~). ?ㅼ젣 吏湲됱븸? 怨좎슜?쇳꽣 ?뺤씤 ?꾩슂.</div>
  `;
  document.getElementById('result').classList.add('show');
}
