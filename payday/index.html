    d=new Date(year,month,0);
  } else {
    const lastDay=new Date(year,month,0).getDate();
    d=new Date(year,month-1,Math.min(+day,lastDay));
  }
  return adjustDate(d,adjust);
}
function fmtDate(d){return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});}
